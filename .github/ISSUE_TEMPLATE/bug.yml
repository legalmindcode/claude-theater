name: Bug report
description: Something doesn't work as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Claude Code version (`claude --version`), where the pane ran (desktop app Code tab / terminal / VS Code), and the mod version (`desktop-mod/.claude-plugin/plugin.json`).
      placeholder: "Windows 11, Claude Code 2.1.308, desktop app Code tab, agent-theater 0.5.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output (optional)
      description: Anything the mod wrote to the Claude Code debug log, or the text the pane showed. Redact any paths/content you'd rather not share.
      render: text
