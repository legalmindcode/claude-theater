name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod:
    name: desktop-mod (validate + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The mod is developed and tested on Claude Code 2.1.308 (its floor is 2.1.304).
      # Exact-version install: `claude plugin test` runs the mod's *.test.ts files inside
      # this binary, so the version installed here is the version under test.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.308
      - name: Validate the marketplace manifest
        run: claude plugin validate .
      - name: Validate the plugin
        run: claude plugin validate desktop-mod
      - name: Run the mod's tests
        run: claude plugin test desktop-mod
